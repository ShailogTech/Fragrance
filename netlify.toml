# Netlify configuration — fully static export, no server functions.
[build]
  command = "npm run build"
  publish = "out"

# Site is served at the domain root, so no base path is needed.
# Long-cache immutable build assets; everything else revalidates.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/products.json"
  [headers.values]
    Cache-Control = "no-cache"
